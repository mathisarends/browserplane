[project]
name = "browsertunnel-workspace"
version = "0.1.0"
description = "Workspace root for the browser provisioner services."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "backend",
    "browser-worker",
    "generated-clients",
]

[tool.uv.sources]
backend = { workspace = true }
browser-worker = { workspace = true }
generated-clients = { workspace = true }

[tool.uv.workspace]
members = ["backend", "browser_worker", "generated"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "httpxgen>=0.1.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py314"
# Rendered by httpxgen; not covered by this repo's lint rules, only by
# `uv run python scripts/generate_http_clients.py --check`.
extend-exclude = ["generated/src/generated/*/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = [
    "backend",
    "browser_worker",
    "generated",
]

[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
    "browser_worker/tests",
    "frontend/tests",
    "generated/tests",
]
pythonpath = [".", "backend/tests", "browser_worker"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = [
    "backend/src",
    "browser_worker/src",
]
omit = [
    "backend/tests/*",
    "browser_worker/tests/*",
    ".venv/*",
]
