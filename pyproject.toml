[project]
name = "browsertunnel-workspace"
version = "0.1.0"
description = "Workspace root for the browsertunnel Python backends."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["browsertunnel", "control-plane"]

[tool.uv.sources]
browsertunnel = { workspace = true }
control-plane = { workspace = true }

[tool.uv.workspace]
members = ["browsertunnel", "control-plane"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["browsertunnel", "control_plane"]

[tool.pytest.ini_options]
testpaths = ["browsertunnel/tests", "control-plane/tests", "frontend/tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["browsertunnel/src", "control-plane/src"]
omit = ["browsertunnel/tests/*", "control-plane/tests/*", ".venv/*"]
