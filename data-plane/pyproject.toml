[project]
name = "data-plane"
version = "0.1.0"
description = "Minimal worker for provisioning Chromium resources and exposing CDP."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.89",
    "cdpify[websocket]>=0.3.0",
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
