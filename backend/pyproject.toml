[project]
name = "backend"
version = "0.1.0"
description = "Edge API the frontend talks to instead of the control plane, data plane or browsertunnel."
requires-python = ">=3.14"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
