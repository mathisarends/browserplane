[project]
name = "backend"
version = "0.1.0"
description = "Frontend-facing API that owns the browser pool, leases and live-traffic relays."
requires-python = ">=3.14"
dependencies = [
    "cdpify[websocket]>=0.3.0",
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "generated-clients",
    "httpx2>=2.12.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyrpckit>=0.2.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0.0",
    "cryptography>=46.0.0",
    "obstore>=0.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
