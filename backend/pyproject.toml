[project]
name = "backend"
version = "0.1.0"
description = "Frontend-facing API that owns the browser pool, leases and live-traffic relays."
requires-python = ">=3.14"
dependencies = [
    "cdpify[websocket]==0.3.0",
    "dishka==1.10.1",
    "fastapi==0.141.1",
    "generated-clients",
    "httpx2==2.12.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "fastapi-rpckit==0.4.1",
    "sqlmodel==0.0.42",
    "asyncpg==0.31.0",
    "alembic==1.19.2",
    "uvicorn[standard]==0.52.4",
    "websockets==17.0.1",
    "cryptography==50.0.1",
    "obstore==0.11.1",
    "fastapi-canon==0.8.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
