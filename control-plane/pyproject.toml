[project]
name = "control-plane"
version = "0.1.0"
description = "Control plane for BrowserTunnel data-plane instances."
requires-python = ">=3.14"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
