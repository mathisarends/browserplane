name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.14.0
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install the worker's FFmpeg dependency
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Select Chromium for the worker
        working-directory: frontend
        run: |
          chromium_path=$(node -p "require('playwright').chromium.executablePath()")
          echo "BROWSER_EXECUTABLE=$chromium_path" >> "$GITHUB_ENV"
          echo "BROWSER_WORKER_EXECUTABLE=$chromium_path" >> "$GITHUB_ENV"
      - run: uv run --locked python scripts/check.py all
      - run: git diff --exit-code -- schemas/openrpc.json frontend/generated frontend/generated-backend generated/src
      - run: uv run --locked python scripts/check.py browser
      - name: Build service images
        run: |
          docker build -f backend/Dockerfile -t browserplane-backend:check .
          docker build -f browser_worker/Dockerfile -t browserplane-worker:check .
