<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrowserTunnel</title>
  </head>
  <body>
    <main id="browser-workspace" class="workspace"></main>

    <template id="browser-panel-template">
      <section class="browser-panel">
        <header class="browser-chrome">
          <div class="browser-heading">
            <span class="browser-identity"></span>
            <span class="plane-label">Data Plane</span>
          </div>
          <div class="tab-strip">
            <div class="window-controls" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="tabs">
              <div class="tab-list" role="tablist" aria-label="Browser-Tabs"></div>
              <button class="new-tab" type="button" aria-label="Neuen Tab öffnen">+</button>
            </div>
          </div>
          <div class="browser-bar">
            <nav class="navigation-controls" aria-label="Seitennavigation">
              <button class="nav-back" type="button" aria-label="Zurück" disabled>
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="m12.5 4.5-5.5 5 5.5 5" />
                </svg>
              </button>
              <button class="nav-forward" type="button" aria-label="Vor" disabled>
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="m7.5 4.5 5.5 5-5.5 5" />
                </svg>
              </button>
              <button class="nav-reload" type="button" aria-label="Neu laden" data-loading="false">
                <svg class="reload-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M15.3 7.1A6 6 0 1 0 16 10" />
                  <path d="M15.3 3.8v3.7H12" />
                </svg>
                <svg class="stop-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M6 6h8v8H6z" />
                </svg>
              </button>
            </nav>
            <form class="address-form">
              <label class="visually-hidden">URL</label>
              <input
                class="address-input"
                name="url"
                type="text"
                inputmode="url"
                value="https://example.com"
                placeholder="URL eingeben"
                autocomplete="url"
                spellcheck="false"
              />
            </form>
          </div>
        </header>

        <canvas
          class="browser-canvas"
          width="1600"
          height="900"
          aria-label="Browser-Stream"
        ></canvas>

        <footer class="stream-status">
          <span>
            <i class="status-dot"></i>
            <span class="active-tab-status">Stream wartet</span>
          </span>
          <span><span class="cursor-status">cursor: default</span> · 1600 × 900</span>
        </footer>
      </section>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
