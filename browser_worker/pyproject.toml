[project]
name = "browser-worker"
version = "0.1.0"
description = "Minimal worker for provisioning Chromium resources and exposing CDP."
requires-python = ">=3.14"
dependencies = [
    "cdpify[websocket]==0.3.0",
    "dishka==1.10.1",
    "fastapi==0.141.1",
    "fastapi-canon==0.8.1",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.52.4",
    "websockets==17.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
