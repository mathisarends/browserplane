x-browser-worker-environment: &browser-worker-environment
  PORT: 8000

x-browser-worker: &browser-worker
  image: browser-provisioner-browser-worker:local
  # browser-worker-1 owns the build; the tag is local-only, so nothing here
  # may fall back to pulling it from a registry.
  pull_policy: never
  environment: *browser-worker-environment
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
    interval: 2s
    timeout: 2s
    retries: 20

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=browser
      - POSTGRES_PASSWORD=browser
      - POSTGRES_DB=browser
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browser -d browser"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Adminer: http://localhost:8080
  # Login:
  #   System:   PostgreSQL
  #   Server:   postgres
  #   Username: browser
  #   Password: browser
  #   Database: browser
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # S3 API: http://localhost:9000
  # Object browser / admin console: http://localhost:9001
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$MINIO_RECORDINGS_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_RECORDINGS_BUCKET: ${MINIO_RECORDINGS_BUCKET:-browser-recordings}
    depends_on:
      minio:
        condition: service_healthy

  # One-shot: brings the schema up to date before the backend opens its pool.
  # Runs the backend image, which the backend service builds; the tag is
  # local-only, so never fall back to pulling it.
  migrate:
    image: browser-provisioner-backend:local
    pull_policy: never
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      - BACKEND_DATABASE_URL=postgresql+asyncpg://browser:browser@postgres:5432/browser
    depends_on:
      postgres:
        condition: service_healthy

  browser-worker-1:
    <<: *browser-worker
    build:
      context: .
      dockerfile: browser_worker/Dockerfile
    ports:
      - "8011:8000"
    environment:
      <<: *browser-worker-environment
      BROWSER_WORKER_PUBLIC_BASE_URL: ws://localhost:8011

  browser-worker-2:
    <<: *browser-worker
    ports:
      - "8012:8000"
    environment:
      <<: *browser-worker-environment
      BROWSER_WORKER_PUBLIC_BASE_URL: ws://localhost:8012

  backend:
    image: browser-provisioner-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_DATABASE_URL=postgresql+asyncpg://browser:browser@postgres:5432/browser
      - BUCKET_NAME=${MINIO_RECORDINGS_BUCKET:-browser-recordings}
      - BUCKET_ENDPOINT=http://minio:9000
      - BUCKET_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - BUCKET_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - BUCKET_PREFIX=recordings
      # Only internal browser-worker addresses are configured. RPC and live-traffic
      # endpoints exposed to the frontend belong to the backend itself.
      - BACKEND_BROWSER_WORKER_1_URL=http://browser-worker-1:8000
      - BACKEND_BROWSER_WORKER_2_URL=http://browser-worker-2:8000
    depends_on:
      browser-worker-1:
        condition: service_healthy
      browser-worker-2:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres-data:
  minio-data:
