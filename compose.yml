x-data-plane: &data-plane
  image: browser-provisioner-data-plane:local
  environment:
    - PORT=8000
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
    interval: 2s
    timeout: 2s
    retries: 20

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=browser
      - POSTGRES_PASSWORD=browser
      - POSTGRES_DB=browser
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browser -d browser"]
      interval: 2s
      timeout: 2s
      retries: 20

  # One-shot: brings the schema up to date before the backend opens its pool.
  # Runs the backend image, which the backend service builds.
  migrate:
    image: browser-provisioner-backend:local
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      - BACKEND_DATABASE_URL=postgresql+asyncpg://browser:browser@postgres:5432/browser
    depends_on:
      postgres:
        condition: service_healthy

  data-plane-1:
    <<: *data-plane
    build:
      context: .
      dockerfile: data-plane/Dockerfile
    ports:
      - "8011:8000"
    environment:
      - PORT=8000
      - DATA_PLANE_PUBLIC_BASE_URL=ws://localhost:8011

  data-plane-2:
    <<: *data-plane
    ports:
      - "8012:8000"
    environment:
      - PORT=8000
      - DATA_PLANE_PUBLIC_BASE_URL=ws://localhost:8012

  backend:
    image: browser-provisioner-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_DATABASE_URL=postgresql+asyncpg://browser:browser@postgres:5432/browser
      # Only internal data-plane addresses are configured. RPC and live-traffic
      # endpoints exposed to the frontend belong to the backend itself.
      - BACKEND_BROWSER_1_DATA_PLANE_URL=http://data-plane-1:8000
      - BACKEND_BROWSER_2_DATA_PLANE_URL=http://data-plane-2:8000
    depends_on:
      data-plane-1:
        condition: service_healthy
      data-plane-2:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres-data:
