[project]
name = "generated-clients"
version = "0.1.0"
description = "Generated typed HTTP clients for the internal browsertunnel APIs."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0",
    "httpx2>=2.12.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generated"]
